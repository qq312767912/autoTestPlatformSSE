# Parallel local deployment for this checkout.
# Keeps the existing wharttest-master stack untouched by using:
# - distinct container names
# - distinct host ports: 9911-9919 and 9922
# - a separate bind-mounted data directory: ./data-parallel
#
# Usage:
#   docker compose -p wharttest-new -f docker-compose.parallel.yml build
#   docker compose -p wharttest-new -f docker-compose.parallel.yml up -d

services:
  postgres:
    image: ${DOCKER_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: wharttest-new-postgres
    command: postgres -c max_connections=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wharttest}
    ports:
      - "0.0.0.0:9919:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${DOCKER_REDIS_IMAGE:-redis:7-alpine}
    container_name: wharttest-new-redis
    ports:
      - "0.0.0.0:9911:6379"
    volumes:
      - redis-data:/data
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./WHartTest_Django
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_BASE_IMAGE:-python:3.11-slim}
        APT_BASE_URL: ${DOCKER_APT_BASE_URL:-http://deb.debian.org}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_INDEX_FALLBACKS: ${DOCKER_PIP_INDEX_FALLBACKS:-}
        HF_ENDPOINT: ${DOCKER_HF_ENDPOINT:-https://huggingface.co}
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmjs.org}
        PLAYWRIGHT_DOWNLOAD_HOST: ${DOCKER_PLAYWRIGHT_DOWNLOAD_HOST:-}
    container_name: wharttest-new-backend
    ports:
      - "0.0.0.0:9912:8000"
    volumes:
      - ./data-parallel:/app/data
      - backend-static:/app/static
      - ./WHartTest_Skills:/app/bundled_skills:ro
      - ./WHartTest_Django/supervisord.conf:/app/supervisord.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db.sqlite3}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-wharttest}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MEDIA_ROOT=${MEDIA_ROOT:-/app/data/media}
      - LANGGRAPH_CHECKPOINT_SQLITE_PATH=${LANGGRAPH_CHECKPOINT_SQLITE_PATH:-/app/data/chat_history.sqlite}
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-this-in-production}
      - LOGIN_RSA_PRIVATE_KEY=${LOGIN_RSA_PRIVATE_KEY:-}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://*:9913,http://127.0.0.1:9913
      - DJANGO_ADMIN_USERNAME=${DJANGO_ADMIN_USERNAME:-admin}
      - DJANGO_ADMIN_EMAIL=${DJANGO_ADMIN_EMAIL:-admin@example.com}
      - DJANGO_ADMIN_PASSWORD=${DJANGO_ADMIN_PASSWORD:-admin123456}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_BASE_URL=http://localhost:8000
      - WEIXIN_PLUGIN_HOST_URL=http://weixin-plugin-host:3001
      - DOCX_EDITOR_BASE_URL=${DOCX_EDITOR_BASE_URL:-http://host.docker.internal:18080}
      - DOCX_EDITOR_PUBLIC_BASE_URL=${DOCX_EDITOR_PUBLIC_BASE_URL:-}
      - DOCX_EDITOR_SERVICE_KEY=${DOCX_EDITOR_SERVICE_KEY:-docx-editor-default-integration-key-2026}
      - QDRANT_URL=http://qdrant:6333
      - HF_ENDPOINT=${DOCKER_HF_ENDPOINT:-https://huggingface.co}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      weixin-plugin-host:
        condition: service_started
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  weixin-plugin-host:
    build:
      context: ./WHartTest_WeixinPluginHost
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${DOCKER_NODE_22_BASE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: wharttest-new-weixin-plugin-host
    ports:
      - "0.0.0.0:9922:3001"
    volumes:
      - ./data-parallel:/app/data
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - WHARTTEST_BACKEND_URL=${WHARTTEST_BACKEND_URL:-http://backend:8000}
      - WHARTTEST_API_KEY=${WHARTTEST_API_KEY:-wharttest-default-mcp-key-2025}
      - WHARTTEST_SHARED_DATA_DIR=/app/data
      - OPENCLAW_STATE_DIR=/app/data/openclaw-state
      - OPENCLAW_CONFIG=/app/data/openclaw-state/openclaw.json
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./WHartTest_Vue
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${DOCKER_NODE_BASE_IMAGE:-node:20-alpine}
        NGINX_BASE_IMAGE: ${DOCKER_NGINX_BASE_IMAGE:-nginx:alpine}
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: wharttest-new-frontend
    ports:
      - "0.0.0.0:9913:80"
    depends_on:
      - backend
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: ./WHartTest_MCP
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_MCP_PYTHON_BASE_IMAGE:-python:3.11-alpine}
        APT_BASE_URL: ${DOCKER_APT_BASE_URL:-http://deb.debian.org}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_INDEX_FALLBACKS: ${DOCKER_PIP_INDEX_FALLBACKS:-}
    container_name: wharttest-new-mcp
    user: root
    environment:
      - WHARTTEST_BACKEND_URL=${WHARTTEST_BACKEND_URL:-http://backend:8000}
      - WHARTTEST_API_KEY=${WHARTTEST_API_KEY:-wharttest-default-mcp-key-2025}
      - MS_API_HOST=${MS_API_HOST:-http://ms.example.com}
      - MS_ACCESS_KEY=${MS_ACCESS_KEY:-your_16byte_key1}
      - MS_SECRET_KEY=${MS_SECRET_KEY:-your_16byte_key2}
    ports:
      - "0.0.0.0:9914:8006"
      - "0.0.0.0:9915:8007"
    volumes:
      - ./data-parallel/playwright-screenshots:/tmp/playwright-output
    depends_on:
      - backend
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8006), 5).close(); socket.create_connection(('127.0.0.1', 8007), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  playwright-mcp:
    image: ${DOCKER_PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp}
    container_name: wharttest-new-playwright-mcp
    user: root
    entrypoint: ["/bin/sh", "/opt/wharttest/playwright-mcp-entrypoint.sh"]
    command: ["--no-sandbox", "--host", "0.0.0.0", "--allowed-hosts", "*"]
    ports:
      - "0.0.0.0:9916:8931"
    volumes:
      - ./data-parallel/playwright-screenshots:/tmp/playwright-output
      - ./WHartTest_MCP/playwright-mcp-entrypoint.sh:/opt/wharttest/playwright-mcp-entrypoint.sh:ro
      - ./WHartTest_MCP/playwright-mcp-config.template.json:/opt/wharttest/playwright-mcp-config.template.json:ro
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8931/mcp', res => process.exit(res.statusCode ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  qdrant:
    image: ${DOCKER_QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: wharttest-new-qdrant
    ports:
      - "0.0.0.0:9918:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - wharttest-network
    restart: unless-stopped

networks:
  wharttest-network:
    driver: bridge

volumes:
  backend-static:
  redis-data:
  postgres-data:
  celery-beat-schedule:
  xinference-data:
  xinference-cache:
  qdrant-data:
