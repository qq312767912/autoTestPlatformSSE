# ============================================
# WHartTest-2.5.0 内网离线部署配置
# ============================================
# 所有镜像均使用本地已加载的镜像，不需要联网
# 前置条件：已通过 offline-import.sh 导入所有镜像
#
# 用法:
#   docker compose -f docker-compose.offline.yml up -d
#
# 注意：此文件不含 build 指令，所有 image 必须已存在于本地

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: wharttest-postgres
    command: postgres -c max_connections=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wharttest}
    ports:
      - "0.0.0.0:8919:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Celery 的 broker 和 backend
  redis:
    image: redis:7-alpine
    container_name: wharttest-redis
    ports:
      - "0.0.0.0:8911:6379"
    volumes:
      - redis-data:/data
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Qdrant 向量数据库 - 知识库检索
  qdrant:
    image: qdrant/qdrant:latest
    container_name: wharttest-qdrant
    ports:
      - "0.0.0.0:8918:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - wharttest-network
    restart: unless-stopped

  # 后端 Django 服务（含 Celery Worker 和 Beat）
  backend:
    image: wharttest-250-backend:latest
    container_name: wharttest-backend
    ports:
      - "0.0.0.0:8912:8000"
    volumes:
      - ./data:/app/data
      - backend-static:/app/static
      - ./skills:/app/bundled_skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db.sqlite3}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-wharttest}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MEDIA_ROOT=${MEDIA_ROOT:-/app/data/media}
      - LANGGRAPH_CHECKPOINT_SQLITE_PATH=${LANGGRAPH_CHECKPOINT_SQLITE_PATH:-/app/data/chat_history.sqlite}
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-this-in-production}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://*:8913
      - DJANGO_ADMIN_USERNAME=${DJANGO_ADMIN_USERNAME:-admin}
      - DJANGO_ADMIN_EMAIL=${DJANGO_ADMIN_EMAIL:-admin@example.com}
      - DJANGO_ADMIN_PASSWORD=${DJANGO_ADMIN_PASSWORD:-admin123456}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_BASE_URL=http://localhost:8000
      - WEIXIN_PLUGIN_HOST_URL=http://weixin-plugin-host:3001
      - DOCX_EDITOR_BASE_URL=${DOCX_EDITOR_BASE_URL:-http://host.docker.internal:18080}
      - DOCX_EDITOR_PUBLIC_BASE_URL=${DOCX_EDITOR_PUBLIC_BASE_URL:-}
      - DOCX_EDITOR_SERVICE_KEY=${DOCX_EDITOR_SERVICE_KEY:-docx-editor-default-integration-key-2026}
      - QDRANT_URL=http://qdrant:6333
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      weixin-plugin-host:
        condition: service_started
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 微信插件宿主服务
  weixin-plugin-host:
    image: wharttest-250-weixin-plugin-host:latest
    container_name: wharttest-weixin-plugin-host
    ports:
      - "0.0.0.0:8922:3001"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - WHARTTEST_BACKEND_URL=${WHARTTEST_BACKEND_URL:-http://backend:8000}
      - WHARTTEST_API_KEY=${WHARTTEST_API_KEY:-wharttest-default-mcp-key-2025}
      - WHARTTEST_SHARED_DATA_DIR=/app/data
      - OPENCLAW_STATE_DIR=/app/data/openclaw-state
      - OPENCLAW_CONFIG=/app/data/openclaw-state/openclaw.json
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 前端 Vue 服务
  frontend:
    image: wharttest-250-frontend:latest
    container_name: wharttest-frontend
    ports:
      - "0.0.0.0:8913:80"
    depends_on:
      - backend
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MCP 服务
  mcp:
    image: wharttest-250-mcp:latest
    container_name: wharttest-mcp
    user: root
    environment:
      - WHARTTEST_BACKEND_URL=${WHARTTEST_BACKEND_URL:-http://backend:8000}
      - WHARTTEST_API_KEY=${WHARTTEST_API_KEY:-wharttest-default-mcp-key-2025}
      - MS_API_HOST=${MS_API_HOST:-http://ms.example.com}
      - MS_ACCESS_KEY=${MS_ACCESS_KEY:-your_16byte_key1}
      - MS_SECRET_KEY=${MS_SECRET_KEY:-your_16byte_key2}
    ports:
      - "0.0.0.0:8914:8006"
      - "0.0.0.0:8915:8007"
    volumes:
      - ./data/playwright-screenshots:/tmp/playwright-output
    depends_on:
      - backend
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8006), 5).close(); socket.create_connection(('127.0.0.1', 8007), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Playwright MCP 服务
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: wharttest-playwright-mcp
    user: root
    entrypoint: ["/bin/sh", "/opt/wharttest/playwright-mcp-entrypoint.sh"]
    command: ["--no-sandbox", "--host", "0.0.0.0", "--allowed-hosts", "*"]
    ports:
      - "0.0.0.0:8916:8931"
    volumes:
      - ./data/playwright-screenshots:/tmp/playwright-output
      - ./config/playwright-mcp-entrypoint.sh:/opt/wharttest/playwright-mcp-entrypoint.sh:ro
      - ./config/playwright-mcp-config.template.json:/opt/wharttest/playwright-mcp-config.template.json:ro
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8931/mcp', res => process.exit(res.statusCode ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  wharttest-network:
    driver: bridge

volumes:
  backend-static:
  redis-data:
  postgres-data:
  qdrant-data:
