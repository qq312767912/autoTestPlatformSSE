[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
pidfile=/app/data/run/supervisord.pid

[program:django]
command=uvicorn wharttest_django.asgi:application --host 0.0.0.0 --port 8000 --workers=1 --lifespan=on --timeout-graceful-shutdown=30
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/data/logs/django_err.log
stdout_logfile=/app/data/logs/django_out.log

# 基础接口池不承接聊天和执行器连接；前端 Nginx 明确路由到 8001。
[program:django_core]
command=uvicorn wharttest_django.asgi:application --host 0.0.0.0 --port 8001 --workers=3 --lifespan=on --timeout-graceful-shutdown=30
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=40
stderr_logfile=/app/data/logs/django_core_err.log
stdout_logfile=/app/data/logs/django_core_out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile_backups=3

[program:celery_worker]
command=celery -A wharttest_django -b redis://redis:6379/0 worker -l info --pool=solo --concurrency=1 --prefetch-multiplier=1 -n default@%%h -Q celery
directory=/app
autostart=true
autorestart=true
stopwaitsecs=180
stopasgroup=true
killasgroup=true
stderr_logfile=/app/data/logs/worker_err.log
stdout_logfile=/app/data/logs/worker_out.log

# 业务独立单进程，禁止与默认队列共用消费者；%%h 交由 Celery 展开。
[program:celery_knowledge]
command=celery -A wharttest_django -b redis://redis:6379/0 worker -l info --pool=solo --concurrency=1 --prefetch-multiplier=1 -n knowledge@%%h -Q knowledge
