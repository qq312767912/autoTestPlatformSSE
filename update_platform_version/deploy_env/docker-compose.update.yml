x-actuator-common: &actuator-common
  image: wharttest-250-actuator:update-178fb3ed-arm64-r4
  pull_policy: never
  # 麒麟 ARM64 64KB 页环境中通过 PATH/symlink 启动 `python main.py`
  # 可能在 CPython getpath 阶段异常；使用绝对解释器和脚本路径规避。
  entrypoint: ["/usr/local/bin/python3.12"]
  command: ["/app/main.py"]
  restart: unless-stopped
  init: true
  shm_size: "${ACTUATOR_SHM_SIZE:-1gb}"
  mem_limit: "${ACTUATOR_MEMORY_LIMIT:-2g}"
  cpus: "${ACTUATOR_CPU_LIMIT:-1.0}"
  environment: &actuator-environment
    WHARTTEST_ACTUATOR_WS_URL: ws://backend:8000/ws/ui/actuator/
    WHARTTEST_ACTUATOR_API_URL: http://backend:8000
    WHARTTEST_ACTUATOR_API_USERNAME: ${ACTUATOR_API_USERNAME:-admin}
    WHARTTEST_ACTUATOR_API_PASSWORD_FILE: /run/secrets/actuator_api_password
    WHARTTEST_ACTUATOR_USE_GUI: "false"
    WHARTTEST_ACTUATOR_HEADLESS: "true"
    WHARTTEST_ACTUATOR_PERSISTENT: "false"
    WHARTTEST_ACTUATOR_BROWSER_TYPE: chromium
    WHARTTEST_ACTUATOR_TRACE_ENABLED: "true"
  secrets:
    - actuator_api_password
  volumes:
    - /projects/ai-test-platform/offline-images/data:/app/data
  extra_hosts:
    - "www.test.sse.com.cn:${SSE_TEST_HOST_IP:-10.122.215.111}"
    - "www.sse.com.cn:${SSE_TEST_HOST_IP:-10.122.215.111}"
    - "static.sse.com.cn:${SSE_TEST_HOST_IP:-10.122.215.111}"
    - "static.test.sse.com.cn:${SSE_TEST_HOST_IP:-10.122.215.111}"
    - "media.sseinfo.com:${SSE_TEST_HOST_IP:-10.122.215.111}"
  networks:
    - wharttest-network

# 与内网当前 docker-compose.offline.yml 叠加使用，覆盖升级服务并新增三个执行器。
services:
  backend:
    image: wharttest-250-backend:update-347a4e12-alpine-r1-arm64
    volumes:
      - /projects/ai-test-platform/update_platform_version/deploy_env/supervisord.single-worker.conf:/app/supervisord.conf:ro
      # 用例审查热修复覆盖层：无需重建 Backend 镜像，可随 Compose 重建持续生效。
      - /projects/ai-test-platform/update_platform_version/deploy_env/hotfix/requirements/services.py:/app/requirements/services.py:ro
      - /projects/ai-test-platform/update_platform_version/deploy_env/hotfix/testcases/review_service.py:/app/testcases/review_service.py:ro
      - /projects/ai-test-platform/update_platform_version/deploy_env/hotfix/testcases/views.py:/app/testcases/views.py:ro
      - /projects/ai-test-platform/update_platform_version/deploy_env/hotfix/testcases/management:/app/testcases/management:ro
      - /projects/ai-test-platform/update_platform_version/deploy_env/hotfix/orchestrator_integration/builtin_tools/skill_tools.py:/app/orchestrator_integration/builtin_tools/skill_tools.py:ro
      - /projects/ai-test-platform/update_platform_version/deploy_env/hotfix/bundled_skills:/app/bundled_skills:ro
    environment:
      VISION_MCP_URL: http://vision-mcp:8010/mcp
      VISION_API_BASE_URL: ${VISION_API_BASE_URL:-}
      VISION_MCP_BASE_URL: ${VISION_MCP_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      VISION_API_CHAT_PATH: ${VISION_API_CHAT_PATH:-}
      VISION_MCP_CHAT_COMPLETIONS_PATH: ${VISION_MCP_CHAT_COMPLETIONS_PATH:-/chat/completions}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MCP_API_KEY: ${VISION_MCP_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_MCP_MODEL: ${VISION_MCP_MODEL:-glm-4.6v-flash}
      VISION_API_TIMEOUT_SECONDS: ${VISION_API_TIMEOUT_SECONDS:-}
      VISION_MCP_TIMEOUT_SECONDS: ${VISION_MCP_TIMEOUT_SECONDS:-120}

  frontend:
    image: wharttest-250-frontend:update-ecff56e4-r1-arm64
    # 与后端共享持久化媒体目录，确保 Skill 生成的交付物可由 Nginx 下载。
    volumes:
      - /projects/ai-test-platform/offline-images/data/media:/app/data/media:ro

  playwright-mcp:
    entrypoint: ["/bin/sh", "/opt/wharttest/playwright-mcp-entrypoint.sh"]
    command: ["--no-sandbox", "--host", "0.0.0.0", "--allowed-hosts", "*"]
    volumes:
      - /projects/ai-test-platform/update_platform_version/deploy_env/playwright-mcp-entrypoint.sh:/opt/wharttest/playwright-mcp-entrypoint.sh:ro
      - /projects/ai-test-platform/update_platform_version/deploy_env/playwright-mcp-config.template.json:/opt/wharttest/playwright-mcp-config.template.json:ro

  vision-mcp:
    image: wharttest-250-vision-mcp:update-01339484-arm64-r2
    container_name: wharttest-vision-mcp
    environment:
      VISION_MCP_BASE_URL: ${VISION_MCP_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      VISION_MCP_CHAT_COMPLETIONS_PATH: ${VISION_MCP_CHAT_COMPLETIONS_PATH:-/chat/completions}
      VISION_MCP_API_KEY: ${VISION_MCP_API_KEY:-}
      VISION_MCP_MODEL: ${VISION_MCP_MODEL:-glm-4.6v-flash}
      VISION_MCP_OCR_PROVIDER: ${VISION_MCP_OCR_PROVIDER:-rapidocr}
      VISION_MCP_TRANSPORT: streamable-http
      VISION_MCP_HOST: 0.0.0.0
      VISION_MCP_PORT: 8010
      VISION_MCP_PATH: /mcp
      VISION_MCP_TIMEOUT_SECONDS: ${VISION_MCP_TIMEOUT_SECONDS:-120}
      VISION_MCP_MAX_RETRIES: ${VISION_MCP_MAX_RETRIES:-2}
    ports:
      - "8923:8010"
    volumes:
      - /projects/ai-test-platform/offline-images/data:/app/data
      - /projects/ai-test-platform/offline-images/data/playwright-screenshots:/tmp/playwright-output:ro
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error; r=urllib.request.Request('http://127.0.0.1:8010/mcp', method='GET');\ntry: urllib.request.urlopen(r, timeout=5)\nexcept urllib.error.HTTPError as e: raise SystemExit(0 if e.code < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  actuator-01:
    <<: *actuator-common
    container_name: wharttest-actuator-01
    environment:
      <<: *actuator-environment
      WHARTTEST_ACTUATOR_ID: actuator-01
      WHARTTEST_ACTUATOR_NAME: 内网执行器-01

  actuator-02:
    <<: *actuator-common
    container_name: wharttest-actuator-02
    environment:
      <<: *actuator-environment
      WHARTTEST_ACTUATOR_ID: actuator-02
      WHARTTEST_ACTUATOR_NAME: 内网执行器-02

  actuator-03:
    <<: *actuator-common
    container_name: wharttest-actuator-03
    environment:
      <<: *actuator-environment
      WHARTTEST_ACTUATOR_ID: actuator-03
      WHARTTEST_ACTUATOR_NAME: 内网执行器-03

secrets:
  actuator_api_password:
    file: /projects/ai-test-platform/update_platform_version/deploy_env/secrets/actuator_api_password
