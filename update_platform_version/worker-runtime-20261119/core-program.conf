[program:django_core]
command=uvicorn wharttest_django.asgi:application --host 0.0.0.0 --port 8001 --workers=3 --lifespan=on --timeout-graceful-shutdown=30
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=40
stderr_logfile=/app/data/logs/django_core_err.log
stdout_logfile=/app/data/logs/django_core_out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile_backups=3
