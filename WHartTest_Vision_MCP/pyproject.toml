[project]
name = "vision-mcp"
version = "0.2.0"
description = "多模态视觉 MCP 服务器 — 为纯文本模型提供图像/视频理解能力"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
vision-mcp = "vision_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
